config:
  integration:
    token-uri: http://datawarehousereader-token.url
    datawarehousereader:
      url: http://datawarehousereader.url
      client-id: the-datawarehousereader-client-id
      client-secret: the-datawarehousereader-client-secret
      connectTimeout: 5
      readTimeout: 30
    bfus:
      url: http://bfus.url
      token-uri: http://bfus-token.url
      client-id: the-bfus-client-id
      client-secret: the-bfus-client-secret
      connectTimeout: 5
      readTimeout: 30
      cutoff-date: 2025-10-21
      external-id: the-external-id
      identifier-type: serviceidentifier
      unit-type: 101
      unit: kWh
      period-size: 15
      consumption-data-source: 2
